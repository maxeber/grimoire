    hideTip(); /* the element under the pointer is about to be replaced */
    const st = S.states[S.at];
    const reach = reachable();
    $('title').textContent = PROG.title;
    $('runBlurb').textContent = SHEET.presets[S.run].blurb;
    $('canvas').innerHTML = drawWires(st, reach) + LAYOUT.order.map(id => nodeBox(id, st, reach)).join('');
    applyTransform();
    $('tree').innerHTML = drawTree();
    $('stack').innerHTML = drawStack(st);
    $('inputs').innerHTML = drawInputs();
    $('errpath').innerHTML = drawErrPath(st);
    $('ledger').innerHTML = drawLedger(st);
    $('cutName').textContent = PROG.nodes[S.open].name;
    $('cutLoc').textContent = PROG.nodes[S.open].loc;
    $('cutBody').innerHTML = S.tab === 'source' ? drawSource(st) : S.tab === 'files' ? drawFiles() : drawContract();
    $('cutBody').classList.toggle('tape--code', S.tab === 'source');
    $('titleblock').innerHTML = drawTitleBlock();
    $('sheetfacts').innerHTML = drawSheetFacts();

    const n = S.states.length - 1;
    $('stepnow').textContent = S.at + ' / ' + n;
    $('traceFill').style.width = (n ? (S.at / n) * 100 : 0) + '%';
    $('traceTick').style.left = (n ? (S.at / n) * 100 : 0) + '%';
    $('traceVal').textContent = st.ended ? st.ended : S.at === 0 ? 'not started' : 'running';
    $('prev').disabled = S.at === 0;
    $('first').disabled = S.at === 0;
    $('next').disabled = S.at >= n;
    $('last').disabled = S.at >= n;
    $('scaleNow').textContent = '1:' + (1 / S.zoom).toFixed(2);
    $('root').classList.toggle('tree-on', S.tree);

    /* The cutaway follows the cursor: the step the run is on is brought into
       view after the tape has been rebuilt, and so is the open row of the
       tree. Nearest edge only, so a step already in view moves nothing. */
    const here = $('cutBody').querySelector('.av-code-line--cursor, .av-code-line--live');
    if (here) here.scrollIntoView({ block: 'nearest' });
    if (S.tree) {
      const sel = $('tree').querySelector('.tr--sel');
      if (sel) sel.scrollIntoView({ block: 'nearest' });
    }
  }

  /* One render per frame, however many pointer events arrive in it. A scrub
     across the trace can fire dozens of moves in a frame, and each render
     rebuilds every region. */
  let renderQueued = false;
  function renderSoon() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(function () {
      renderQueued = false;
      render();
    });
  }

  /* -- stepping ----------------------------------------------------------- */
  const holdsHere = i => {
    const m = S.states[i].move;
    if (!m) return false;
    if ($('holdEffect').checked && m.k === 'effect') return true;
    if ($('holdError').checked && (m.k === 'throw' || m.k === 'uncaught' || (m.k === 'effect' && m.raised !== undefined))) return true;
    return false;
  };

  /* The cutaway opens the frame the cursor is in, so stepping, playing and
     scrubbing always show the step that ran. A node opened by hand stays open
     until the cursor next moves. Once the run has ended no frame is open, and
     the last node stays. */
  function follow() {
    const fr = S.states[S.at].frames;
    if (fr.length) S.open = fr[fr.length - 1].nodeId;
  }

  /* Jump the cursor with no edge to animate: a run change, the ends, a scrub. */
  function jumpTo(i) {
    S.at = Math.min(S.states.length - 1, Math.max(0, i));
    S.redraw = null;
    follow();
  }

  function step(dir) {
    const n = S.states.length - 1;
    const to = Math.min(n, Math.max(0, S.at + dir));
    if (to === S.at) return false;
    if (dir > 0) {
      S.redraw = S.states[to].moved;
    } else {
      /* Stepping back over a call redraws it callee to caller, so unwinding
         reads as unwinding. The redraw keeps its direction: that is what
         tells a mutual pair's two wires apart. */
      S.redraw = G.back(S.states, S.at).redraw;
    }
    S.at = to;
    follow();
    render();
    return true;
  }

  function stopPlaying() {
    if (!S.playing) return false;
    clearInterval(S.playing);
    S.playing = null;
    $('play').textContent = 'play';
    return true;
  }
  function startPlaying() {
    if (S.playing) return;
    $('play').textContent = 'stop';
    S.playing = setInterval(function () {
      if (!step(1) || holdsHere(S.at)) stopPlaying();
    }, 520);
  }
  function play() {
    if (S.playing) stopPlaying();
    else startPlaying();
  }

  /* -- wiring ------------------------------------------------------------- */

  /* The two controls whose contents outlive one render, looked up here so the
     two functions below can be called in any order after this point. The
     picker is absent on a one-graph file, so every read of it is guarded. */
  const sheetPicker = $('sheet');
  const layerGrp = $('layerGrp');

  /* The run picker's options are the sheet's, so they are rebuilt when the
     sheet changes and at no other time. Kept apart from syncControls, which
     runs on every click: tearing down a select and rebuilding it to set a
     class on a tab is work for nothing, and it drops the reader's place in an
     open dropdown. */
  function fillRunPicker() {
    const sel = $('run');
    sel.innerHTML = '';
    SHEET.presets.forEach(function (p, i) {
      const o = document.createElement('option');
      o.value = String(i);
      o.textContent = p.name + ' — ' + p.blurb;
      sel.appendChild(o);
    });
  }

  /* Every control's appearance, derived from S rather than poked at the point
     of the click. A handler that sets its own button's class is right until a
     sheet switch changes S underneath it, at which point the page shows one
     sheet's drawing with another sheet's controls. So the handlers set state
     and call this, and this is also what a switch calls. One reading, one
     writer. */
  function syncControls() {
    $('run').value = String(S.run);
    if (sheetPicker) sheetPicker.value = String(sheetAt);
    [...layerGrp.querySelectorAll('button')].forEach(function (b) {
      b.className = b.textContent === S.layer ? 'on' : '';
    });
    $('viewPlan').className = S.tree ? '' : 'on';
    $('viewTree').className = S.tree ? 'on' : '';
    /* Zoom has nothing to act on in the tree, so it greys out — to the text
       floor, and no further. */
    $('zoomIn').disabled = S.tree;
    $('zoomOut').disabled = S.tree;
    $('zoomFit').disabled = S.tree;
    [...document.querySelectorAll('.tab')].forEach(function (t) {
      t.className = 'tab' + (t.getAttribute('data-tab') === S.tab ? ' tab--on' : '');
    });
  }

  /* A sheet the reader has been on before comes back as they left it, because
     nothing here rebuilds its state — it only swaps which one is read. */
  if (sheetPicker) {
    sheetPicker.addEventListener('change', function (e) {
      stopPlaying();
      const fresh = useSheet(Number(e.target.value));
      fillRunPicker();
      syncControls();
      render();
      /* A sheet opened for the first time is fitted to the pane, the way the
         page fits the first one. A sheet the reader has been on keeps the zoom
         and the pan they left it at, which is the point. */
      if (fresh) $('zoomFit').click();
    });
  }

  $('run').addEventListener('change', function (e) {
    stopPlaying();
    S.run = Number(e.target.value);
    S.states = G.fold(SHEET, SHEET.presets[S.run].trace);
    jumpTo(0);
    render();
  });

  $('next').addEventListener('click', function () { step(1); });
  $('prev').addEventListener('click', function () { step(-1); });
  $('first').addEventListener('click', function () { jumpTo(0); render(); });
  $('last').addEventListener('click', function () { jumpTo(S.states.length - 1); render(); });
  $('play').addEventListener('click', play);

  /* THE SCHEME CONTROL. The attribute on <html> is the whole of the mechanism —
   * the design system's dark layer keys off it — so this only sets it,
   * remembers it, and keeps the button describing what it will do next.
   *
   * It names the DESTINATION, not the state: while the page is light the button
   * shows a moon and says "Switch to dark". The label is what a screen reader
   * gets and what a hover reveals, so the drawing never carries the meaning on
   * its own.
   *
   * The inline script in <head> applied the saved choice before first paint;
   * this reads the attribute back rather than keeping a second copy of the
   * truth. Storage stays best-effort: a page opened from file:// can throw on
   * access in some browsers, and a toggle that works for this sitting but is
   * not remembered is a much smaller failure than one that throws. */
  /* toggleAttribute, NOT `.hidden`. The `hidden` IDL property is defined on
   * HTMLElement, and these two are SVGElement — so `svg.hidden = true` sets a
   * plain JS expando and never touches the attribute the [hidden] rule
   * matches. Written that way first, and the effect was a toggle that flipped
   * the scheme, the title and the stored value while the icon sat unchanged:
   * the property and the attribute disagreed, and only the attribute renders. */
  var paintScheme = function () {
    var dark = document.documentElement.getAttribute('data-aviation-scheme') === 'dark';
    document.querySelector('.scheme-moon').toggleAttribute('hidden', dark);
    document.querySelector('.scheme-sun').toggleAttribute('hidden', !dark);
    var next = dark ? 'light' : 'dark';
    $('schemeToggle').title = 'Switch to ' + next;
    $('schemeToggle').setAttribute('aria-label', 'Switch to ' + next);
  };
  $('schemeToggle').addEventListener('click', function () {
    var dark = document.documentElement.getAttribute('data-aviation-scheme') === 'dark';
    if (dark) document.documentElement.removeAttribute('data-aviation-scheme');
    else document.documentElement.setAttribute('data-aviation-scheme', 'dark');
    try { localStorage.setItem('aviation-scheme', dark ? 'light' : 'dark'); } catch (e) {}
    paintScheme();
  });
  paintScheme();

  /* The trace is taken hold of, not only clicked. While the reader holds it,
     play pauses so the two do not fight over the cursor, and resumes on
     release if it was running. */
  const trace = $('traceSpan');
  let scrub = null;
  const scrubTo = clientX => {
    const box = trace.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (clientX - box.left) / box.width));
    jumpTo(Math.round(frac * (S.states.length - 1)));
    renderSoon();
  };
  trace.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    e.preventDefault();
    scrub = { resume: stopPlaying() };
    trace.setPointerCapture(e.pointerId);
    $('root').classList.add('scrubbing');
    scrubTo(e.clientX);
  });
  trace.addEventListener('pointermove', function (e) {
    if (!scrub) return;
    scrubTo(e.clientX);
  });
  const endScrub = function () {
    if (!scrub) return;
    const resume = scrub.resume;
    scrub = null;
    $('root').classList.remove('scrubbing');
    if (resume) startPlaying();
  };
  trace.addEventListener('pointerup', endScrub);
  trace.addEventListener('pointercancel', endScrub);

  /* The toggle offers every layer the file declares, so a file with three
     layers does not get two buttons. A file that declares none disables it and
     says why. Layers belong to the change, so the same buttons serve every
     sheet — what changes with the sheet is only which one is lit, and
     syncControls reads that off S. */
  if (!layerNames.length) {
    /* Named for the layer a reader expects, and switched off with the reason
       held as its help note. aria-disabled rather than disabled, because a
       disabled button gets no pointer events and the note could never show. */
    const b = document.createElement('button');
    b.textContent = 'tests';
    b.setAttribute('aria-disabled', 'true');
    b.setAttribute('data-help', 'This file declares no layer map, so there is no second set of dependencies to redraw under.');
    layerGrp.appendChild(b);
  } else {
    layerNames.forEach(function (name) {
      const b = document.createElement('button');
      b.textContent = name;
      b.addEventListener('click', function () {
        S.layer = name;
        syncControls();
        render();
      });
      layerGrp.appendChild(b);
    });
  }

  $('viewPlan').addEventListener('click', function () {
    S.tree = false;
    syncControls();
    render();
  });
  $('viewTree').addEventListener('click', function () {
    S.tree = true;
    syncControls();
    render();
  });

  const ZOOM_MIN = 0.15, ZOOM_MAX = 2;
  const setZoom = z => { S.zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z)); render(); };
  $('zoomIn').addEventListener('click', function () { setZoom(S.zoom * 1.25); });
  $('zoomOut').addEventListener('click', function () { setZoom(S.zoom / 1.25); });

  /* The wheel. Plain, it scrolls the drawing the way it scrolls any sheet;
     with shift it scrolls sideways; with ctrl (cmd on a Mac) it zooms about
     the pointer, so the part under it stays under it. Neither rebuilds the
     page — the transform and the scale readout move, and nothing else — since
     a wheel fires many times a second and a render rebuilds every region.
     Listened to as non-passive so the browser's own ctrl-wheel page zoom is
     declined. The tree is a scrolling column already and is left alone. */
  $('plan').addEventListener('wheel', function (e) {
    if (S.tree) return;
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? $('plan').clientHeight : 1;
    if (e.ctrlKey || e.metaKey) {
      const box = $('plan').getBoundingClientRect();
      const mx = e.clientX - box.left, my = e.clientY - box.top;
      const factor = Math.exp(-e.deltaY * unit * 0.0015);
      const z = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, S.zoom * factor));
      /* The canvas point under the pointer, kept under it at the new scale. */
      const cx = (mx - S.panX) / S.zoom, cy = (my - S.panY) / S.zoom;
      S.zoom = z;
      S.panX = mx - cx * z;
      S.panY = my - cy * z;
      $('scaleNow').textContent = '1:' + (1 / S.zoom).toFixed(2);
    } else if (e.shiftKey && !e.deltaX) {
      S.panX -= e.deltaY * unit;
    } else {
      S.panX -= e.deltaX * unit;
      S.panY -= e.deltaY * unit;
    }
    applyTransform();
  }, { passive: false });
  $('zoomFit').addEventListener('click', function () {
    const box = $('plan').getBoundingClientRect();
    S.panX = 0;
    S.panY = 0;
    setZoom(Math.min(box.width / (LAYOUT.canvasW + 72), box.height / (LAYOUT.canvasH + 72)));
  });

  [...document.querySelectorAll('.tab')].forEach(function (t) {
    t.addEventListener('click', function () {
      S.tab = t.getAttribute('data-tab');
      syncControls();
      render();
    });
  });

  /* Pan. The drawing does not fit at 1:1 in any arrangement, so this is
     load-bearing rather than a convenience. A drag that starts on a node pans
     too — a node is a part of the drawing, not a control — and only a press
     that never moved counts as a click on it. */
  let drag = null;
  let swallowClick = false;
  const plan = $('plan');
  plan.addEventListener('pointerdown', function (e) {
    if (e.button !== 0 || S.tree) return;
    e.preventDefault();
    /* The node under the press is remembered here, because it cannot be read
       later: once the plan captures the pointer, the browser retargets the
       release and the click it synthesises to the plan itself, and a click
       handler asking what node it landed on gets no answer. */
    const nd = e.target.closest('[data-node]');
    drag = { x: e.clientX - S.panX, y: e.clientY - S.panY, sx: e.clientX, sy: e.clientY, moved: false, node: nd ? nd.getAttribute('data-node') : null };
    plan.setPointerCapture(e.pointerId);
  });
  plan.addEventListener('pointermove', function (e) {
    if (!drag) return;
    if (!drag.moved) {
      if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) < 4) return;
      drag.moved = true;
      plan.classList.add('grabbing');
    }
    S.panX = e.clientX - drag.x;
    S.panY = e.clientY - drag.y;
    applyTransform();
  });
  plan.addEventListener('pointerup', function () {
    if (!drag) return;
    const d = drag;
    drag = null;
    plan.classList.remove('grabbing');
    /* A press that never moved is a click on the node it started on. The
       click the browser fires next is spent, whatever it lands on. */
    swallowClick = true;
    if (!d.moved && d.node) {
      S.open = d.node;
      render();
    }
  });
  plan.addEventListener('pointercancel', function () {
    drag = null;
    plan.classList.remove('grabbing');
  });

  /* Rows in the tree, frames in the stack: anything outside the plan that
     names a node opens it on an ordinary click. */
  document.addEventListener('click', function (e) {
    const spent = swallowClick;
    swallowClick = false;
    if (spent) return;
    const el = e.target.closest ? e.target.closest('[data-node]') : null;
    if (!el) return;
    S.open = el.getAttribute('data-node');
    render();
  });

  /* The splitters. Each moves one of the two custom properties the grid reads,
     clamped so neither region can be dragged out of existence. Nothing is
     remembered between visits; the page is a disposable artifact. */
  const root = $('root');
  function splitter(el, axis, apply) {
    let held = null;
    el.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      e.preventDefault();
      held = true;
      el.setPointerCapture(e.pointerId);
      el.classList.add('held');
      root.classList.add('splitting', 'splitting-' + axis);
    });
    el.addEventListener('pointermove', function (e) {
      if (!held) return;
      apply(e);
    });
    const release = function () {
      if (!held) return;
      held = null;
      el.classList.remove('held');
      root.classList.remove('splitting', 'splitting-' + axis);
    };
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
  }
  splitter($('splitV'), 'v', function (e) {
    /* The CONTENT edge, not the border edge. --side-w is a grid track, and the
       tracks live inside the sheet's frame; measuring to the border box drags
       the panel past the pointer by the frame's width. clientLeft is that
       width and clientWidth is the track area, so this holds whatever the
       frame weighs — including nothing, which is what it weighed before the
       sheet was laid on a ground. */
    const box = root.getBoundingClientRect();
    const right = box.left + root.clientLeft + root.clientWidth;
    const w = Math.min(window.innerWidth * 0.5, Math.max(256, right - e.clientX));
    root.style.setProperty('--side-w', w + 'px');
  });
  splitter($('splitH'), 'h', function (e) {
    const bottom = $('cut').getBoundingClientRect().bottom;
    const h = Math.min(window.innerHeight * 0.7, Math.max(96, bottom - e.clientY));
    root.style.setProperty('--cut-h', h + 'px');
  });

  /* The help note. Shown after a short rest on anything that carries a
     data-help, or at once when focus lands on it; hidden on leave, blur, a
     press, a scroll, Escape, or a render — which replaces the thing under the
     pointer. The text is set as text, never as markup, and it is the page's
     own: nothing from the file reaches a data-help. */
  const tip = document.createElement('div');
  tip.className = 'tip';
  tip.id = 'tip';
  tip.setAttribute('role', 'tooltip');
  tip.hidden = true;
  document.body.appendChild(tip);
  let tipTimer = null;
  let tipFor = null;
  function hideTip() {
    if (tipTimer) { clearTimeout(tipTimer); tipTimer = null; }
    if (!tipFor) return;
    tip.hidden = true;
    tipFor.removeAttribute('aria-describedby');
    tipFor = null;
  }
  function showTip(el) {
    const text = el.getAttribute('data-help');
    if (!text) return;
    tipFor = el;
    tip.textContent = text;
    tip.className = 'tip';
    /* Measured at the window's origin. A fixed box keeps the last note's
       place while hidden, and its width shrinks to what is right of that
       place, so a long note measured after one near the edge came back too
       narrow and was placed by the wrong width. */
    tip.style.left = '0px';
    tip.style.top = '0px';
    tip.hidden = false;
    el.setAttribute('aria-describedby', 'tip');
    /* Where it goes is the module's arithmetic, so a test can hold it. */
    const at = G.tipAt(el.getBoundingClientRect(), tip.getBoundingClientRect(),
      { width: window.innerWidth, height: window.innerHeight });
    if (at.above) tip.className = 'tip tip--above';
    tip.style.left = at.left + 'px';
    tip.style.top = at.top + 'px';
    tip.style.setProperty('--tip-lead', at.lead + 'px');
  }
  document.addEventListener('pointerover', function (e) {
    const el = e.target.closest ? e.target.closest('[data-help]') : null;
    if (!el || el === tipFor) return;
    hideTip();
    tipTimer = setTimeout(function () { tipTimer = null; showTip(el); }, 300);
  });
  document.addEventListener('pointerout', function (e) {
    const el = e.target.closest ? e.target.closest('[data-help]') : null;
    if (!el) return;
    if (e.relatedTarget && el.contains(e.relatedTarget)) return;
    hideTip();
  });
  document.addEventListener('focusin', function (e) {
    const el = e.target.closest ? e.target.closest('[data-help]') : null;
    if (el) { hideTip(); showTip(el); }
  });
  document.addEventListener('focusout', hideTip);
  document.addEventListener('pointerdown', hideTip, true);
  window.addEventListener('scroll', hideTip, true);
  window.addEventListener('resize', hideTip);

  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') hideTip();
    // A form control gets its own arrow keys. Without this, an arrow pressed
    // on the run picker steps the run and then the select's own change
    // handler reseeds it, so the step is spent and thrown away — and an arrow
    // on either hold moved the run for no reason at all.
    const t = e.target;
    if (t && ['SELECT', 'INPUT', 'TEXTAREA'].indexOf(t.tagName) >= 0) return;
    if (t && t.isContentEditable) return;
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'ArrowLeft') step(-1);
  });

  fillRunPicker();
  syncControls();
  render();
  $('zoomFit').click();
}
</script>
</body>
</html>
