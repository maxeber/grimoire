<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>groundtrack — /*TITLE*/</title>
<script>
/* LIGHT IS THE DEFAULT, and the operating system is not consulted. That is the
   design system's own policy — dark.css never reads prefers-color-scheme — and
   this page now follows it rather than making an exception. A reader who wants
   dark says so with the control in the head, and that choice is what is
   remembered; an OS preference is not a request about this page.

   Inline and before first paint, so a reader who chose dark last time never
   sees a light flash. The attribute goes on <html>, which is the element the
   deck theme sits on: a theme answers some roles with ink, those resolve where
   they are declared, and a scheme set lower would leave the subtree half-dark.

   Storage is best-effort. A page opened from file:// has an opaque origin in
   some browsers and localStorage throws on access, not just on write — hence
   the try around the read as well. Failing means light, which is the default
   anyway, so nothing else needs to know. */
try{if(localStorage.getItem('aviation-scheme')==='dark')document.documentElement.setAttribute('data-aviation-scheme','dark')}catch(e){}
</script>
<style>
/* The faces are vendored and inlined as data URIs. This page makes no network
   request at all: a font CDN is a dependency on somebody else's uptime, some
   hosts will not load one, and a drawing whose monospace silently degrades is
   a worse drawing. */
/*FONTS*/
</style>
<style>
/* AVIATION — the design system, whole, from dist/aviation.bundle.css. Tokens,
   both themes, the dark layer, the av-* vocabulary and the av-tool-* report
   chrome. It is inlined ahead of this page's own <style> so everything below
   wins by source order where the two ever meet. Do not edit it here: replace
   it from the design system repository. */
/*AVIATION*/
</style>
<style>

/* THE TWO SIZES THIS PAGE MOVES ------------------------------------------
   Everything else — the ramp, the space scale, the rules, the classes, the
   dark layer — arrives from the bundle inlined above. These two do not.

   Both sit one step above the deck theme's. A slide is read from across a
   room at one size; this sheet is read at a desk in a lot of eleven-pixel
   labels, and measured against paper those did not resolve. Declared here
   rather than raised upstream because it is this page's reading distance
   that is different, not the system's scale. */
:root {
  --av-t-micro: 0.75rem;  /* deck: 0.6875rem */
  --av-t-annot: 0.875rem; /* deck: 0.8125rem */
}

/* ==========================================================================
   The sheet. Everything below is this page's own, written in the system's
   vocabulary: rules at the three weights, space off the scale, caps-mono
   labels, neutrals from the ink ramp, and no colour that is not a signal.
   ========================================================================== */
* { box-sizing: border-box; }
body { margin: 0; }
.none { color: var(--av-ink-30); } /* an absent value is a mark, not text */
/* The failure kind, and what a node does with a tag. Neither is author text:
   each is one word of a closed set the file never writes, derived from the
   throw steps and the raised moves. So they set as marks — micro, tracked,
   upper — beside the tag, which is the author's and reads as text. */
.ekind, .efate { font-size: var(--av-t-micro); text-transform: uppercase;
  letter-spacing: var(--av-track-label); font-weight: 500; color: var(--av-ink-70); }
.efate { color: var(--av-ink-30); }
.etag { display: block; white-space: normal; }
/* Secondary text — an aside, a description, a message — is ink 80. The system
   floor is 70, and the labels stay there; running text at 70 on paper read as
   grey, and a reader who cannot read an aside has been handed nothing. */
.dim { color: var(--av-ink-80); }
/* An effect that returned and an effect that threw are the walk-sheet roles
   the design system names, not the raw marks: an effect that threw and an
   error in flight are one condition, and an effect that returned is resolved
   exactly as a caught error is. Asking for the role is what lets the site
   theme answer with redline, where caution folds to ink and would have said
   nothing. */
.ok { color: var(--av-path-caught); }
.caut { color: var(--av-path); }

/* Every region is defined by how fast what it holds changes, and each control
   sits with what it acts on. The two splitters move --side-w and --cut-h. */
/* minmax(0, 1fr), not 1fr: a track's automatic minimum is its content, so one
   wide child — the run picker, which is as wide as a run's blurb — widens the
   column rather than shrinking itself, and the page grows a horizontal
   scrollbar on a narrow screen. Nothing here wants a content floor; the plan
   and the cutaway both clip their own overflow. */
/* The sheet is laid on a desk, and --av-ground is the desk. A tool window is
   not a slide: without a ground the sheet runs to the bezel and stops being a
   sheet. The inset is one space unit, which is the least that reads as an
   edge; the bold frame is the sheet's own outline, the same weight the system
   gives every object outline. The ground carries no text, which is the rule
   that decides it can be a colour at all. */
body { height: 100vh; box-sizing: border-box; padding: var(--av-s1);
  background: var(--av-ground); overflow: hidden; }

/* THE PANEL SHADOW IS A DELIBERATE LOCAL EXCEPTION to the system's rule 5
   ("No gradients, no drop shadows, no photographs. Depth comes from line
   weight."). It is declared here, in the tool, and NOT as an --av-* token,
   because the exception is groundtrack's and the system does not sanction it.
   If it ever should, it needs a token and an amended rule, not a copy of this
   line in a second consumer.

   It cannot be built from ink. A shadow is darker than whatever it falls on,
   in both schemes; every ink-derived value inverts with the scheme and would
   turn this into a glow on a dark ground. So it is a literal, and the dark
   scheme restates it rather than inheriting one. */
.sheet-root { --gt-panel-shadow: 0 2px 6px rgb(34 38 43 / 0.16); }
@media screen {
  [data-aviation-scheme="dark"] .sheet-root,
  [data-aviation-scheme="dark"].sheet-root { --gt-panel-shadow: 0 2px 6px rgb(0 0 0 / 0.45); }
}
.sheet-root { --side-w: 22rem; --cut-h: 12rem; height: 100%;
  /* background-COLOR, not the shorthand: this rule loads after the bundle, and
     `background:` would reset background-image and silently erase .av-grid's
     ruling from the element carrying it. */
  background-color: var(--av-paper); border: var(--av-rule-bold) solid var(--av-ink);
  box-sizing: border-box;
  display: grid; grid-template-columns: minmax(0, 1fr) var(--side-w);
  grid-template-rows: auto 1fr var(--cut-h) auto;
  grid-template-areas: 'head head' 'plan side' 'cut side' 'block block';
  overflow: hidden; }

/* Head — the pickers and the step controls. It drives the run.
   Two rows: the lockup and the step controls above, the pickers below. The
   pickers went under the title because a select wide enough to read a run's
   blurb crowds the title off a narrow screen when both share a row, and the
   sheet picker made that row one control longer. */
/* min-width 0 on both, or the grid does not hold them: a grid item's automatic
   minimum is its content, so a picker wider than the pane widens the whole
   head, and the head widens the column instead of the picker shrinking. */
/* The chrome panels are SHEETS LAID ON THE GRID, not tinted boxes. --av-surface
   is paper at 72%: it holds the grid back without hiding it, which is what the
   token exists for. The plan is the one place the grid comes through raw,
   because the plan IS the drafting surface — and that is what stops the drawing
   reading as the only textured thing on screen, recessed under flat chrome.
   Measured on the surface fill: ink 14.3:1, ink-70 5.76:1, and the marks 4.72
   (amber) and 4.71 (green) — above the floor, which a --av-ground fill was not
   (4.35). The boundaries drop to a hairline because the shadow now carries the
   separation the bold rule used to. */
.head { grid-area: head; display: flex; flex-direction: column; gap: var(--av-s2); min-width: 0;
  padding: var(--av-s2) var(--av-s3); border-bottom: var(--av-rule-hair) solid var(--av-ink);
  background: var(--av-surface); box-shadow: var(--gt-panel-shadow); position: relative; z-index: 2; }
.head-row { display: flex; align-items: center; gap: var(--av-s3); flex-wrap: wrap; min-width: 0; }
.head-id { display: flex; align-items: center; gap: var(--av-s2); min-width: 0; }
/* THE MARK DOES NOT FOLLOW THE SCHEME, and its fills say so by reading
   --av-deck-* rather than the live names.

   It used to read --av-ink and --av-paper, which swap under a dark scheme —
   so the mark turned into a pale square with dark linework, the logo
   inverted. It is not a light mark that needs a dark counterpart; it already
   carries its own dark ground, and it should look the same in both schemes.

   --av-deck-* is the deck theme's STAGED palette: declared once at :root,
   unconditionally, read by nothing else, and never remapped by dark.css. That
   is the system's own way of writing "this value does not invert", so the
   fills stay token references rather than becoming hardcoded hexes.

   Stated here rather than beside the <svg> because the markup ships to every
   reader of every report and this is a note for whoever edits the template. */
.head-mark { flex: none; display: block; }
/* The lockup: the mark beside two stacked rows, the sheet's name over the
   selected run's line. The mark is sized to both rows together (the title's
   18px at 1.3, plus the annotation's 14px at 1.45 = 43.7px), so it stands
   against the pair rather than floating beside one of them. */
.head-text { display: flex; flex-direction: column; min-width: 0; }
.head-title { font-size: var(--av-t-lead); font-weight: 600; line-height: 1.3; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; max-width: 28rem; }
/* A blurb is a sentence, so the cap is generous — 34rem clipped the shipped
   examples on a wide screen. Narrow screens still ellipsis it, by flex shrink. */
.head-blurb { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52rem; }
select, button, input { font: inherit; font-size: var(--av-t-micro); color: var(--av-ink);
  background: var(--av-paper); border: var(--av-rule-hair) solid var(--av-ink-30); border-radius: 0;
  padding: 4px var(--av-s2); }
select { font-size: var(--av-t-annot); border-color: var(--av-ink); border-width: var(--av-rule-thin); max-width: 22rem; }
/* The run picker reads "name — blurb", which the 22rem cap cut mid-sentence.
   It takes whatever the row has left instead — the labels, the sheet picker
   and the step controls are all as wide as their content, so the run picker is
   the one thing on the row with a reason to grow. min-width 0 lets it shrink
   below its content too, so a narrow window narrows the box rather than the
   page. The sheet picker keeps the default cap: a graph title is a few words,
   and a picker wider than the longest of them is empty box. */
#run { flex: 1 1 0; min-width: 0; max-width: none; }
input[type=checkbox] { accent-color: var(--av-ink); margin: 0 var(--av-s1) 0 0; vertical-align: -1px; }
.btn { text-transform: uppercase; letter-spacing: var(--av-track-label); font-weight: 500; cursor: pointer;
  transition: border-color 150ms; }
.btn:hover { border-color: var(--av-ink); }
/* A control that can do nothing right now stays legible — ink 70 is the text
   floor — and loses its outline weight and its pointer. Structure, not tone. */
.btn[disabled] { color: var(--av-ink-70); cursor: default; border-color: var(--av-ink-12); }
/* No auto margin: the run picker absorbs the row's slack, so the controls sit
   against it rather than being flung at the far edge — and when the row wraps
   on a narrow window they start at the left like everything else. */
.btn-group { display: flex; gap: var(--av-s1); align-items: center; flex: none; }
/* The scheme control, top right of the lockup row rather than down with the
   run controls: it changes how the sheet is READ, not where the cursor is.

   It shows the DESTINATION, not the state: the moon is offered while the page
   is light. Both drawings ship in the markup and one carries [hidden], rather
   than one drawing whose path is rewritten — nothing has to reflow, and the
   geometry stays readable in the source. Stroke reads currentColor, so the
   icon is whatever the button is: colour is signal in this system and a scheme
   is not a condition.

   A button like every other control on this row — it inherits the shared
   `select, button, input` rule above, so same type, same border, same vertical
   padding — carrying a drawing instead of a word, so the horizontal padding
   comes in to match.

   THE HEIGHT IS NOT ARITHMETIC. The ::before is a zero-width strut exactly one
   line box tall, the same box a word makes in a text button, and the icon is
   deliberately shorter than it. So the strut sets the height and the two kinds
   of button match by construction — and keep matching if the type scale moves,
   which on this page it already has. */
/* margin-left: auto, not a spacer element: the lockup row is a wrap-enabled
   flex, so the auto margin takes the row's slack and drops the button to the
   left of the next line when the row wraps, rather than leaving a gap. */
.btn-scheme { margin-left: auto; padding-left: 8px; padding-right: 8px; display: inline-flex; align-items: center; }
.btn-scheme::before { content: ""; display: block; width: 0; height: 1.6em; }
/* HIDDEN BY DEFAULT, SHOWN WHEN NOT [hidden] — and this pair does the hiding
   itself rather than leaning on the UA.
   The `hidden` attribute does nothing at all to an <svg>: the UA stylesheet
   declares `@namespace` as XHTML, so its `[hidden]` rule carries an implied
   universal selector in that namespace and never matches an SVG element. Two
   attempts got this wrong — a bare `display: block` painted both icons, and so
   did `:not([hidden])` on its own, because there was nothing left to hide the
   other one. Stating both halves here needs no rule anywhere else in the file
   and no UA behaviour. */
.btn-scheme svg { display: none; width: 16px; height: 16px; }
.btn-scheme svg:not([hidden]) { display: block; }
.stepnow { font-size: var(--av-t-micro); letter-spacing: var(--av-track-label); font-variant-numeric: tabular-nums;
  color: var(--av-ink-70); min-width: 6rem; text-align: right; }

/* Plan — the drawing. Pan and zoom are load-bearing: it does not fit at 1:1.
   A drag anywhere on it pans, a node included, and a drag selects no text. The
   wheel pans too, and with ctrl held it zooms about the pointer. */
.plan { grid-area: plan; overflow: hidden; position: relative;
  border-right: var(--av-rule-hair) solid var(--av-ink); cursor: grab; touch-action: none; }
.plan.grabbing { cursor: grabbing; }
.plan.grabbing, .plan.grabbing * { user-select: none; -webkit-user-select: none; }
#canvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; padding: var(--av-s4); }
#wires { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.sheet-root.tree-on .plan { cursor: default; }

/* The wires. Line weight says what the run did: open now, bold;
   run already, thin; not yet, a hairline in construction ink. A cut edge is
   dashed. No hex value lives here — every stroke reads the ramp. */
.wire { fill: none; stroke: var(--av-ink-30); stroke-width: var(--av-rule-hair); }
.wire--walked { stroke: var(--av-ink); stroke-width: var(--av-rule-thin); }
.wire--live { stroke: var(--av-ink); stroke-width: var(--av-rule-bold); }
.wire--cut { stroke-dasharray: 4 4; }
.wire--err { stroke-dasharray: 4 4; }
.ar { fill: var(--av-ink-30); }
.ar--ink { fill: var(--av-ink); }
/* The direction of a call is something a reader sees rather than works out.
   It keeps moving while the cursor rests on the move, so a step is never a
   still frame that looks frozen. The system's reduced-motion block collapses
   it when the reader has asked for that. */
@keyframes flow { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
@keyframes flow-rev { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 24; } }
.wire--flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
.wire--flow-rev { stroke-dasharray: 6 6; animation: flow-rev 1.2s linear infinite; }
/* How many frames of a self-calling node are open, beside its loop wire. A
   figure, not a picture, and it never moves. */
.wire-count { fill: var(--av-ink); font-size: var(--av-t-micro); font-weight: 600; font-variant-numeric: tabular-nums; }
.nd-count { font-size: var(--av-t-micro); font-weight: 600; margin-left: var(--av-s1); }

/* A node is a part on the drawing. Its states are line weights: the open one
   carries an outline set off the box, one on the stack a hairline outside it,
   one the run has never called a hairline box in construction ink. */
.nd { position: absolute; width: 356px; background: var(--av-paper); border: var(--av-rule-bold) solid var(--av-ink);
  padding: var(--av-s2); cursor: pointer; overflow: hidden; transition: border-color 150ms; }
.nd--cold { border-width: var(--av-rule-hair); border-color: var(--av-ink-30); color: var(--av-ink-70); }
.nd--sel { outline: var(--av-rule-thin) solid var(--av-ink); outline-offset: 7px; }
.nd--active { outline: var(--av-rule-hair) solid var(--av-ink-30); outline-offset: 4px; }
.nd--error { border-color: var(--av-path); }
.nd-top { display: flex; align-items: center; gap: var(--av-s1); margin-bottom: 2px; }
.nd-name { font-weight: 600; font-size: var(--av-t-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nd-loc { font-size: var(--av-t-micro); color: var(--av-ink-70); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nd-ch { display: grid; grid-template-columns: max-content 1fr; gap: 0 var(--av-s1); font-size: var(--av-t-micro);
  margin-top: var(--av-s1); padding-top: var(--av-s1); border-top: var(--av-rule-hair) solid var(--av-ink-12); }
.nd-ch b { font-weight: 600; cursor: help; }
.nd-ch span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fx { display: flex; align-items: center; gap: var(--av-s1); font-size: var(--av-t-micro); color: var(--av-ink-70); margin-top: 3px; }
.fx-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--av-ink-30); flex: none; }
.fx-lead { width: var(--av-s2); border-top: var(--av-rule-thin) solid var(--av-ink-30); flex: none; }
.fx-txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fx--ok .fx-dot { background: var(--av-path-caught); }
.fx--ok .fx-lead { border-top-color: var(--av-path-caught); }
.fx--fail .fx-dot { background: var(--av-path); }
.fx--fail .fx-lead { border-top-color: var(--av-path); }
.nd-cut { font-size: var(--av-t-micro); color: var(--av-caution); margin-top: 3px; }
.chip-help { cursor: help; }

/* The tree. The same file and the same run, on paper. Stepping works here;
   only the animation goes. A running row carries a bold left rule; the
   row whose node is open in the cutaway carries a thin ink box, the same
   outline the drawing gives the open node. No fill. */
.tree { padding: var(--av-s4) var(--av-s3); overflow: auto; height: 100%; display: none; flex-direction: column; gap: 2px; }
.sheet-root.tree-on .tree { display: flex; }
.sheet-root.tree-on #canvas, .sheet-root.tree-on #wires { display: none; }
/* A row is a small grid, not one line. Name, kind and the three channels sit
   on the first line and wrap when they must; the call site and the effect
   marks take a second line under them. On one nowrap line a long name painted
   straight over the channels next to it. */
.tr { display: grid; grid-template-columns: minmax(14rem, max-content) 5rem minmax(12rem, 1fr);
  column-gap: var(--av-s3); row-gap: var(--av-s1); align-items: baseline;
  /* The system's pitch is 24px. At 5px the row sat under it; a quarter step
     top and bottom puts the rows on the grid the sheet is ruled to. */
  padding: var(--av-s1) var(--av-s2); background: var(--av-paper);
  font-size: var(--av-t-annot); border: var(--av-rule-hair) solid var(--av-ink-12);
  border-left: var(--av-rule-bold) solid transparent; cursor: pointer; }
.tr--cold { color: var(--av-ink-70); }
/* Running and waiting, and the two are not the same job. The frame the run is
   IN keeps full ink; the frames waiting under it take the system's state
   rule, which is ink 55 — a stroke that means something is held to 3:1, and
   it never takes a hue, because waiting is not a condition. */
.tr--active { border-left-color: var(--av-ink); }
.tr--waiting { border-left-color: var(--av-state-rule); }
.tr--sel { border-color: var(--av-ink); border-width: var(--av-rule-thin); border-left-width: var(--av-rule-bold); }
/* Selection is already the box on all four sides, so the left rule stays the
   run's to spend. */
.tr--sel.tr--waiting { border-left-color: var(--av-state-rule); }
.tr-name { font-weight: 600; overflow-wrap: anywhere; }
.tr-kind { align-self: baseline; }
.tr-ch { font-size: var(--av-t-micro); min-width: 0; overflow-wrap: anywhere; }
.tr-ch b { font-weight: 600; cursor: help; }
.tr-ch .sep { display: inline-block; width: var(--av-s2); }
.tr-under { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 2px var(--av-s3); font-size: var(--av-t-micro); }
.tr-under:empty { display: none; }
.tr-site { color: var(--av-ink-70); overflow-wrap: anywhere; }
/* Ink 80 and not the 70 floor: the line now carries chips, and the words
   around them are what the chips qualify. */
.tr-fx { color: var(--av-ink-80); white-space: nowrap; }
/* THE CHIP. A denser cut of the system's own .av-state — hairline border, a
   filled point, caps — because that one is sized for a title block and these
   sit inline in a 13px row, three or four to a line. Same vocabulary, same
   currentColor discipline: the chip carries no colour of its own, so one rule
   below paints it and the border and the point follow. */
.gt-chip { display: inline-flex; align-items: center; gap: var(--av-s1);
  padding: 1px var(--av-s1); border: var(--av-rule-hair) solid currentColor;
  text-transform: uppercase; letter-spacing: var(--av-track-label);
  font-weight: 500; white-space: nowrap; vertical-align: 1px; }
.gt-chip::before { content: ''; width: 5px; height: 5px; border-radius: 50%;
  background: currentColor; flex: none; }

/* Where a row's call site stands on the current error: thrown, propagated,
   caught. Three channels, because a hue is not one — the site
   scheme folds the path to redline and a colour-blind reader has no hue at
   all — and each says the same thing on its own:

     the stripe   an inset rule down the row's left edge, just inside the
                  run-state border. Drafting order: the object outline is
                  outermost and its annotation sits within, which also puts
                  the stripe hard against the glyph and the word it qualifies
                  so the three read as one mark.
     the glyph    before the name. The channel that survives one ink.
     the word     a chip after the name. The channel that needs no legend.

   Left and not right: the right edge never argues with the run-state rule,
   which is why the stripe would start there — but a reader enters a row at
   its left edge, and that is where the rarest signal on the sheet belongs.
   Only the throw takes a rule under the row as well; it is the one position a
   reader looks for first. The tag stays outside the chip, as author text: the
   chip sets caps and a tag is the author's. */
.tr--onpath { box-shadow: inset 3px 0 0 var(--av-path); }
.tr--caught { box-shadow: inset 3px 0 0 var(--av-path-caught); }
.tr--thrown { box-shadow: inset 3px 0 0 var(--av-path); border-bottom: var(--av-rule-bold) solid var(--av-ink); }
.tr-gl { font-weight: 600; margin-right: var(--av-s1); color: var(--av-path); cursor: help; }
.tr-gl--caught { color: var(--av-path-caught); }
.tr-pl { font-size: var(--av-t-micro); color: var(--av-path); margin-left: var(--av-s2); }
.tr-pl--caught { color: var(--av-path-caught); }
.tr-err-tag { font-weight: 600; margin-left: var(--av-s1); }

/* THE EFFECT OUTCOME, at the weight of the path label. It is the answer to a
   sheet that reads monochrome on a run where nothing breaks: returned, threw
   and not called is a closed set, derived per call site, live the moment a
   node is entered. It already owned the two roles — .ok and .caut above — and
   spent them on an 11px word inside an ink-70 line, where the colour was
   present and invisible. Not called is an absence and an absence costs no
   ink, so drawTree never gives it the chip in the first place — it stays plain
   text at the floor, and the chips that ARE drawn all mean something. */
.tr-fxm--not-called { color: var(--av-ink-70); }

/* The rail. It reads the run, and it moves on every step. Deleting it changes
   the drawing's scale by nothing, so what goes in it is never an argument
   about the drawing, and the tools are its header. */
.side { grid-area: side; position: relative; overflow-y: auto; display: flex; flex-direction: column;
  background: var(--av-surface); box-shadow: var(--gt-panel-shadow); z-index: 2; }
/* The sticky head sits ON the panel, so it takes the panel's own fill rather
   than the surface again — two translucent layers would stack to a lighter
   band exactly where a heading should not stand out on tone. */
.side-head { display: flex; flex-direction: column; gap: 2px;
  padding: var(--av-s2) var(--av-s3); border-bottom: var(--av-rule-hair) solid var(--av-ink);
  position: sticky; top: 0; background: var(--av-paper); z-index: 1; }
/* The tools. Every control that changes how the sheet is READ, then the holds
   that say where a run stops. They are the panel's own rows, not a block: no
   frame, no fill, no rules between buttons. A key column makes them read as a
   table. The live tool takes the tab treatment, full ink and a bold bottom
   rule, which is line weight and not a fill. They left the plan pane because
   the tree has no pan: a row under them stayed under them. */
.side-head .grp { display: flex; align-items: stretch; }
/* Top, not centre: beside a wrapped row the key names its first line. */
.side-head .grp-k { width: 4.5rem; flex: none; padding: 3px var(--av-s2) 3px 0; align-self: flex-start; }
/* The layer row is built from the file, so its width is data. A row too long
   for the rail wraps under its first control, not under its key. */
.side-head .grp-v { display: flex; flex-wrap: wrap; align-items: stretch; min-width: 0; }
.side-head .grp-v button, .side-head .grp-v label { padding: 3px var(--av-s2); font-size: var(--av-t-micro);
  text-transform: uppercase; letter-spacing: var(--av-track-label); color: var(--av-ink);
  border: 0; border-bottom: var(--av-rule-bold) solid transparent; }
.side-head .grp-v button { background: transparent; cursor: pointer; }
.side-head .grp-v button:hover { border-bottom-color: var(--av-ink-30); }
.side-head .grp-v button.on { border-bottom-color: var(--av-ink); font-weight: 600; }
.side-head .grp-v button[disabled] { color: var(--av-ink-70); cursor: default; font-weight: 400; }
.side-head .grp-v button[disabled]:hover { border-bottom-color: transparent; }
/* A tool that can do nothing on this file keeps its name and loses its weight,
   and carries the reason as a help note. It is not the disabled attribute: a
   disabled button gets no pointer events, so the note could never show. */
.side-head .grp-v button[aria-disabled=true] { color: var(--av-ink-70); cursor: help; font-weight: 400; }
.side-head .grp-v button[aria-disabled=true]:hover { border-bottom-color: transparent; }
/* A hold is a control, so it keeps the pointer its job gives it, help note or
   not. */
.side-head .grp-v label { display: inline-flex; align-items: center; cursor: pointer; }
.side-head .now { padding: 3px var(--av-s2); font-size: var(--av-t-micro); letter-spacing: var(--av-track-label);
  font-variant-numeric: tabular-nums; align-self: center; }
.blk { padding: var(--av-s2) var(--av-s3) var(--av-s3); border-bottom: var(--av-rule-hair) solid var(--av-ink-12); }
.blk > .av-label { display: block; margin-bottom: var(--av-s1); }
.row { display: flex; gap: var(--av-s1); font-size: var(--av-t-annot); align-items: baseline; }
.row-k { color: var(--av-ink-70); flex: none; }
/* The error path's own glyph column, the same marks the tree draws. */
.epath-gl { flex: none; width: 1.1em; font-weight: 600; color: var(--av-path); }
.epath-gl--caught { color: var(--av-path-caught); }
.row-v { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frame { display: block; width: 100%; text-align: left; border: 0; border-left: var(--av-rule-bold) solid transparent;
  padding: 2px var(--av-s2); cursor: pointer; background: transparent; font-size: var(--av-t-annot); }
.frame--top { border-left-color: var(--av-ink); }
.var { display: flex; align-items: baseline; gap: var(--av-s1); margin-bottom: 2px; }
.var-k { width: 6rem; flex: none; font-size: var(--av-t-micro); color: var(--av-ink-70); text-align: right; }
.var-v { min-width: 0; flex: 1; font-size: var(--av-t-micro); overflow-wrap: anywhere; }
.led { display: flex; gap: var(--av-s1); font-size: var(--av-t-micro); padding: 2px 0;
  border-bottom: var(--av-rule-hair) solid var(--av-ink-12); }
.led:last-child { border-bottom: 0; }
.led-seq { color: var(--av-ink-70); flex: none; }
.led-body { min-width: 0; flex: 1; }
.led-body div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* The splitters. Two grips, one on the rail's left edge and one on the
   cutaway's top edge, each over the bold rule already drawn there. They move
   the two custom properties the grid reads and nothing else.

   The grip is invisible at rest, since the rule under it is already the edge.
   Under the pointer it shows itself two ways: the rule under it thickens to
   a bold ink line along its whole length, and a short bar sits at its
   middle — the handle a reader was looking for. The hit zone is wider than
   the rule, because an eight-pixel target measured as too hard to find. */
.split { position: absolute; z-index: 5; touch-action: none; }
.split-v { left: -7px; top: 0; bottom: 0; width: 14px; cursor: col-resize; }
.split-h { top: -7px; left: 0; right: 0; height: 14px; cursor: row-resize; }
.split::before, .split::after { content: ''; position: absolute; background: var(--av-ink); opacity: 0;
  transition: opacity 150ms; pointer-events: none; }
.split-v::before { left: 5px; top: 0; bottom: 0; width: 4px; }
.split-h::before { top: 5px; left: 0; right: 0; height: 4px; }
.split-v::after { left: 2px; top: 50%; width: 10px; height: 48px; margin-top: -24px; }
.split-h::after { top: 2px; left: 50%; height: 10px; width: 48px; margin-left: -24px; }
.split:hover::before, .split:hover::after, .split.held::before, .split.held::after { opacity: 1; }
.sheet-root.splitting, .sheet-root.splitting * { user-select: none; -webkit-user-select: none; }
.sheet-root.splitting-v { cursor: col-resize; }
.sheet-root.splitting-h { cursor: row-resize; }

/* The cutaway. One node — its source, its files, its declared contract. The
   listing itself is the design system's: .av-code and .av-code-* in tools.css
   carry the technical paper, the gutter stripes and the five token classes,
   so nothing here restyles them. What used to be .tp / .tp-n / .tp-lbl / .kw
   was a local fork of exactly that vocabulary and is gone. */
.cut { grid-area: cut; position: relative; border-top: var(--av-rule-hair) solid var(--av-ink);
  border-right: var(--av-rule-hair) solid var(--av-ink); display: flex; flex-direction: column; min-height: 0; }
.cut-head { display: flex; align-items: baseline; gap: var(--av-s2); padding: var(--av-s1) var(--av-s3);
  border-bottom: var(--av-rule-hair) solid var(--av-ink-12); background: var(--av-surface); }
/* The tape is chrome, so it takes the surface its own head already wears and
   the rail and the footer band wear beside it. The files table and the
   contract read as a panel rather than as text left on the drafting surface,
   which is what the plan is for. The source tab is the exception and lays its
   own technical paper over this — see .tape--code below. */
.tape { flex: 1; overflow: auto; padding: var(--av-s2) var(--av-s3) var(--av-s3);
  background: var(--av-surface); }
.tabs { margin-left: auto; display: flex; gap: var(--av-s2); }
.tab { border: 0; background: transparent; padding: 2px 0; font-size: var(--av-t-micro); text-transform: uppercase;
  letter-spacing: var(--av-track-label); color: var(--av-ink); cursor: pointer;
  border-bottom: var(--av-rule-bold) solid transparent; transition: border-color 150ms; }
.tab:hover { border-bottom-color: var(--av-ink-30); }
.tab--on { border-bottom-color: var(--av-ink); font-weight: 600; }
/* The listing fills the tape rather than sitting in it: the technical paper is
   a plane, and a plane with a margin around it reads as a card. The tape's own
   padding comes off for the source tab only, so the other two tabs keep it. */
.tape--code { padding: 0; }
.tape--code .av-code { border: 0; min-height: 100%; }
/* The third track wraps; the two gutter tracks do not. Set here because the
   system sizes the tracks and leaves what goes in them to the tool. */
.av-code-line > span:last-child { overflow-wrap: anywhere; }
.fgroup { margin-bottom: var(--av-s3); }
.fgroup > .av-label { display: block; margin-bottom: var(--av-s1); }
/* A directory tree, one step of indent per level. The indent is a class on a
   wrapper rather than a width on the row, because a depth written into an
   attribute is a number the markup has to compute and this one does not. */
.ftree { padding-left: var(--av-s3); border-left: var(--av-rule-hair) solid var(--av-ink-12); }
/* A directory prints in the case the path is written in. Upper-casing it, the
   way a label is upper-cased, would show a reader a path that is not the one
   in the change. */
.fdir { font-size: var(--av-t-annot); color: var(--av-ink-70); padding: 1px 0; overflow-wrap: anywhere; }
.fdir + .frow, .fdir + .ftree { margin-top: 1px; }
/* A file is a mark, a path and its counts on one line, with the reason trailing
   the path the way a comment trails a line of code. */
/* Counts lead the row, the path reads next, and the change kind lands as a
   word rather than an initial. The counts lead because a size is the thing a
   reader compares between rows, and tabular-nums keeps the digits on one axis
   within a depth. They do NOT form one column down the whole group: the rows
   sit in a directory tree and the tree indents them, exactly as it indented
   the mark that used to lead. Pulling them out of the indent would buy one
   straight column at the cost of the tree, which is the more useful shape.
   No tilt on the label:
   the deck theme rotates a STAMP, which lands once on a sheet to conclude it,
   and twenty rotated labels down a file list is ornament rather than a stamp.
   It would also break the baseline the grid is holding. */
.frow { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr) 6rem; gap: 0 var(--av-s2); align-items: baseline;
  font-size: var(--av-t-annot); padding: 1px 0; }
.fwhy { font-size: var(--av-t-micro); color: var(--av-ink-70); }
/* .av-label carries the caps, tracking and weight; only the alignment is ours. */
.fchange { text-align: right; white-space: nowrap; }
.fpath { min-width: 0; overflow-wrap: anywhere; }
.fnum { font-variant-numeric: tabular-nums; font-size: var(--av-t-micro); color: var(--av-ink-70); white-space: nowrap; }
/* THE COUNTS ARE COLOURED ON THE READER'S CALL, and it is a second deliberate
   exception — this one to rule 2, "each accent has exactly one meaning". Green
   means nominal and amber means caution in this theme; lines added and lines
   removed are neither. The exception was taken with the alternative (both at
   ink, separated by tier) drawn beside it.

   Written as the live --av-* names rather than literals so it degrades the way
   the system intends: the site theme folds both accents to ink, so a site-themed
   listing loses the coding rather than importing amber into a theme that refuses
   it, and dark picks up the dark siblings. */
.fadd { color: var(--av-normal); }
.fdel { color: var(--av-caution); }

/* The footer band states the sheet. Only the trace moves. The title block sits
   under the band's own top rule, so its other three sides are dropped. */
.block { grid-area: block; border-top: var(--av-rule-hair) solid var(--av-ink);
  background: var(--av-surface); box-shadow: var(--gt-panel-shadow); position: relative; z-index: 2; }
.block .av-titleblock { border-left: 0; border-right: 0; border-bottom: 0; border-top: 0; }
.stamp { align-self: flex-start; cursor: help; }
.trace { padding: var(--av-s2) var(--av-s3); border-top: var(--av-rule-hair) solid var(--av-ink-12); }
.traceband { display: flex; align-items: center; gap: var(--av-s4); }
.sheetfacts { display: flex; align-items: baseline; gap: var(--av-s3); flex: none; font-size: var(--av-t-micro);
  color: var(--av-ink-70); white-space: nowrap; max-width: 46rem; overflow: hidden; text-overflow: ellipsis; }
.sheetfacts span + span { padding-left: var(--av-s3); border-left: var(--av-rule-hair) solid var(--av-ink-12); }
.sheetfacts b { font-weight: 600; color: var(--av-ink); }
/* The trace is a dimension line the reader can take hold of at any time,
   including while the run is playing. */
.trace-span { position: relative; flex: 1; height: 18px; display: flex; align-items: center; cursor: pointer;
  touch-action: none; }
.trace-rule { position: absolute; inset: 50% 0 auto; height: 0; border-top: var(--av-rule-thin) solid var(--av-ink-30); }
.trace-fill { position: absolute; inset: 50% auto auto 0; height: 0; border-top: var(--av-rule-bold) solid var(--av-ink); }
.trace-tick { position: absolute; top: 0; bottom: 0; width: 0; border-left: var(--av-rule-bold) solid var(--av-ink); }
.sheet-root.scrubbing .trace-span { cursor: grabbing; }
.sheet-root.scrubbing, .sheet-root.scrubbing * { user-select: none; -webkit-user-select: none; }

/* The help note. One element, moved to whatever carries a data-help when the
   pointer rests on it or focus lands on it. An annotation on paper in the
   system's vocabulary: a thin ink box, annotation size, ink 80 — no shadow, no
   radius, no colour. The text is the page's own and never the file's. */
/* Never wider than the window less a margin each side, so there is always
   room to keep it inside: the module's tipAt counts on that. */
.tip { position: fixed; z-index: 20; max-width: min(38ch, calc(100vw - 2 * var(--av-s2))); padding: var(--av-s1) var(--av-s2);
  background: var(--av-paper); color: var(--av-ink-80); border: var(--av-rule-thin) solid var(--av-ink);
  font-size: var(--av-t-annot); line-height: 1.45; text-transform: none; letter-spacing: normal;
  font-weight: 400; pointer-events: none; }
.tip[hidden] { display: none; }
/* The leader sits over the middle of the thing the note describes. The page
   sets where, because the note is kept inside the window and the thing is not. */
.tip::before { content: ''; position: absolute; left: var(--tip-lead, var(--av-s2)); top: -7px; width: 5px; height: 5px;
  border-radius: 50%; background: var(--av-ink); transform: translateX(-50%); }
.tip--above::before { top: auto; bottom: -7px; }
/* A control that carries a help note keeps the cursor its job gives it. The
   two grips said col-resize and row-resize and were shown as an arrow, because
   `inherit` here took the parent's cursor and outranked the grip's own rule. */
[data-help] { cursor: help; }
button[data-help], select[data-help] { cursor: inherit; }
button[data-help] { cursor: pointer; }
button[data-help][disabled] { cursor: default; }
button[data-help][aria-disabled=true] { cursor: help; }
.split-v[data-help] { cursor: col-resize; }
.split-h[data-help] { cursor: row-resize; }
.trace-span[data-help] { cursor: pointer; }

.refused { padding: var(--av-s4); max-width: 60rem; }
.refused h1 { font-size: var(--av-t-h3); }
.refused li { font-size: var(--av-t-annot); }
</style>
</head>
<body class="av-paper">
<!-- The grid rules the WHOLE sheet, not just the plan. It used to rule the plan
     alone, which made the drawing the only textured surface on the screen and
     left it reading as recessed under flat chrome — the grid was doing a
     ground's job. Ruling the sheet and floating the panels on --av-surface puts
     it back where it belongs: under everything, showing through raw only where
     the drawing is. -->
<div class="sheet-root av-grid" id="root">
  <div class="head">
   <div class="head-row">
    <div class="head-id">
      <!-- The groundtrack mark, the 40px-and-up variant, inlined so the page
           still fetches nothing. All five sleepers and the inset ground are
           here, which is what the small variant drops; below 40px the 1.0
           hairlines stop resolving, so this one is never drawn below 40.
           Geometry is the brand handoff's, coordinate for coordinate; do not
           tidy the paths. Colours are --av-deck-*, so the mark does not
           invert — see .head-mark in the stylesheet. -->
      <svg class="head-mark" viewBox="0 0 24 24" width="44" height="44" role="img" aria-label="groundtrack" data-help="groundtrack">
        <rect x="0.8" y="0.8" width="22.4" height="22.4" fill="var(--av-deck-ink)"></rect>
        <g transform="rotate(90 12 12) translate(24,0) scale(-1,1)">
          <g fill="none" stroke="var(--av-deck-paper)" stroke-width="1.0">
            <path d="M13.2 19 A 5.8 5.8 0 0 1 19 13.2"></path>
            <path d="M6.8 19 A 12.2 12.2 0 0 1 19 6.8"></path>
          </g>
          <g stroke="var(--av-deck-paper)" stroke-width="1.05">
            <line x1="6.8" y1="19" x2="13.2" y2="19"></line>
            <line x1="7.73" y1="14.33" x2="13.64" y2="16.78"></line>
            <line x1="10.37" y1="10.37" x2="14.90" y2="14.90"></line>
            <line x1="14.33" y1="7.73" x2="16.78" y2="13.64"></line>
            <line x1="19" y1="6.8" x2="19" y2="13.2"></line>
          </g>
        </g>
        <g stroke="var(--av-deck-paper)" stroke-width="1.0">
          <line x1="10.8" y1="5.0" x2="10.8" y2="1.9"></line>
          <line x1="17.2" y1="5.0" x2="17.2" y2="1.9"></line>
        </g>
        <g stroke="var(--av-deck-caution)" stroke-width="1.05">
          <line x1="10.8" y1="2.6" x2="17.2" y2="2.6"></line>
        </g>
      </svg>
      <div class="head-text">
        <span class="head-title" id="title"></span>
        <!-- The selected run's line. It sits under the sheet's name rather than
             loose on the head row, so the head reads as one lockup; the run
             picker is a step away, and the label on it says what it changes. -->
        <span class="av-annot head-blurb" id="runBlurb"></span>
      </div>
    </div>
    <!-- The scheme control, top right of the lockup row. Both drawings ship;
         one carries [hidden]. See .btn-scheme. -->
    <button class="btn btn-scheme" id="schemeToggle" type="button">
      <svg class="scheme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="miter" aria-hidden="true"><path d="M16.124 4 A 9 9 0 1 0 16.124 20 A 8 8 0 0 1 16.124 4 Z"></path></svg>
      <svg class="scheme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="miter" aria-hidden="true" hidden><circle cx="12" cy="12" r="5"></circle><line x1="19.6" y1="12" x2="22.4" y2="12"></line><line x1="18.582" y1="8.2" x2="21.007" y2="6.8"></line><line x1="15.8" y1="5.418" x2="17.2" y2="2.993"></line><line x1="12" y1="4.4" x2="12" y2="1.6"></line><line x1="8.2" y1="5.418" x2="6.8" y2="2.993"></line><line x1="5.418" y1="8.2" x2="2.993" y2="6.8"></line><line x1="4.4" y1="12" x2="1.6" y2="12"></line><line x1="5.418" y1="15.8" x2="2.993" y2="17.2"></line><line x1="8.2" y1="18.582" x2="6.8" y2="21.007"></line><line x1="12" y1="19.6" x2="12" y2="22.4"></line><line x1="15.8" y1="18.582" x2="17.2" y2="21.007"></line><line x1="18.582" y1="15.8" x2="21.007" y2="17.2"></line></svg>
    </button>
   </div>
   <!-- Everything that drives the run, under the lockup and in the order a
        reader chooses it: the sheet, then the run on it, then the controls
        that step that run. The sheet reads first because it changes slower
        than a run and it changes what the runs are. -->
   <div class="head-row">
    <!--SHEETS-->
    <label class="av-label" for="run">run</label>
    <select id="run" data-help="Which recorded run to step. Each run is one route through the graph."></select>
    <div class="btn-group">
      <button class="btn" id="first" data-help="Back to the start">|&lt;</button>
      <button class="btn" id="prev" data-help="Step back one move">&lt;</button>
      <button class="btn" id="play" data-help="Play the run. It stops at a hold, or at the end.">play</button>
      <button class="btn" id="next" data-help="Step forward one move">&gt;</button>
      <button class="btn" id="last" data-help="Jump to the end">&gt;|</button>
      <span class="stepnow" id="stepnow" data-help="The move the cursor is on, out of the moves in this run"></span>
    </div>
   </div>
  </div>

  <!-- Nothing sits on the plan pane: the drawing and the tree own all of it. -->
  <div class="plan" id="plan">
    <div id="canvas"></div>
    <div class="tree" id="tree"></div>
  </div>

  <div class="side" id="side">
    <div class="split split-v" id="splitV" data-help="Drag to resize the rail"></div>
    <!-- The tools, as the rail's header. See .side-head .grp. -->
    <div class="side-head">
      <div class="grp">
        <span class="grp-k av-label">zoom</span>
        <div class="grp-v">
          <button id="zoomOut" data-help="Zoom out">&minus;</button>
          <button id="zoomFit" data-help="Fit the whole drawing in the pane">fit</button>
          <button id="zoomIn" data-help="Zoom in">+</button>
          <span class="now" id="scaleNow" data-help="The scale the drawing is shown at, as a ratio">1:1</span>
        </div>
      </div>
      <div class="grp">
        <span class="grp-k av-label" data-help="A layer redraws the same graph under a different set of dependencies. The test layer is the obvious one.">layer</span>
        <div class="grp-v" id="layerGrp"></div>
      </div>
      <div class="grp">
        <span class="grp-k av-label">view</span>
        <div class="grp-v">
          <button id="viewPlan" class="on" data-help="The drawing">plan</button>
          <button id="viewTree" data-help="The same graph as an indented tree, one row per call site. Stepping still works here.">tree</button>
        </div>
      </div>
      <div class="grp">
        <span class="grp-k av-label">hold</span>
        <div class="grp-v">
          <label data-help="When playing, stop on the next move that touches the outside world — a network call, a file, the console."><input type="checkbox" id="holdEffect">effect</label>
          <label data-help="When playing, stop on the next throw, the next effect that throws, or an error reaching the top uncaught."><input type="checkbox" id="holdError">error</label>
        </div>
      </div>
    </div>
    <div class="blk"><span class="av-label" data-help="The frames open at the cursor, top first. How the run got to the node it is on.">call stack</span><div id="stack"></div></div>
    <div class="blk"><span class="av-label" data-help="The values this run started from. Read-only: the run was recorded under exactly these.">arguments</span><div id="inputs"></div></div>
    <div class="blk"><span class="av-label" data-help="How far the current error has travelled: where it was thrown, which frames it propagated through, and where it was caught.">error path</span><div id="errpath"></div></div>
    <div class="blk"><span class="av-label" data-help="Every effect the run has run so far, in order, with what the author says it returned or threw.">effects ledger</span><div id="ledger"></div></div>
  </div>

  <div class="cut" id="cut">
    <div class="split split-h" id="splitH" data-help="Drag to resize the cutaway"></div>
    <div class="cut-head">
      <span class="av-label" data-help="One node, opened up. Click a node on the drawing or a row in the tree to open it here.">cutaway</span>
      <strong id="cutName"></strong>
      <span class="av-annot" id="cutLoc"></span>
      <div class="tabs">
        <button class="tab tab--on" data-tab="source" data-help="The node's steps, with the cursor marked">source</button>
        <button class="tab" data-tab="files" data-help="The files this node changes, the files other nodes change, and every file in the change, so you can see where one sits in the whole. Each row carries its added and removed lines and how it changed: new, modified, deleted or forbidden.">files</button>
        <button class="tab" data-tab="contract" data-help="What the node declares: what it takes, what it returns on success, the errors it can throw, and what it requires">contract</button>
      </div>
    </div>
    <div class="tape" id="cutBody"></div>
  </div>

  <div class="block">
    <div class="av-titleblock" id="titleblock"></div>
    <div class="trace">
      <div class="traceband">
        <div class="sheetfacts" id="sheetfacts"></div>
        <div class="trace-span" id="traceSpan" data-help="Drag or click to move the cursor">
          <div class="trace-rule"></div>
          <div class="trace-fill" id="traceFill"></div>
          <div class="trace-tick" id="traceTick"></div>
        </div>
        <span class="av-dimension-value" id="traceVal"></span>
      </div>
    </div>
  </div>
</div>

<script>/*MODULE*/</script>
<script>
"use strict";
/* The player may derive, never decide. It pushes a frame, pops a frame,
   appends a ledger row and moves a cursor — all of that in the shared module,
   which the tests run too. It evaluates nothing, and this page contains no
   dynamic code evaluation at all. */
const PROG = Groundtrack.hardenKeys(/*DATA*/);
const G = Groundtrack;
const esc = G.esc;
const $ = id => document.getElementById(id);

/* Fixed text the page shows for the three channels and the two stamps. None
   of it is author text, which is why it may sit in an attribute. */
const HELP = {
  success: 'success — what this node returns.',
  error: 'error — the tags this node can throw as a fail. A die is a defect, and never listed here.',
  requirements: 'requirements — what this node needs to work. A layer can rename these.',
  role: 'What kind of thing this node is. The page prints it. The check reports a pure node that runs an effect.',
  err: {
    thrown: 'Where the current error started: this call threw it.',
    propagated: 'The current error left this call without being caught, on its way up.',
    caught: 'A handler at this call caught the current error.',
  },
  authored: 'Written by hand from the material. A claim about the program, not a recording of it.',
  captured: 'Produced by a real run.',
  paths: 'Cyclomatic complexity of the node as drawn: one, plus one for each if, each error handler and each backward jump. It measures the drawing, and the drawing is what the author chose to draw of the code.',
};

/* The page holds the trace to the graph before drawing it. A move naming a step
   the node has not got, or a pop with no frame open, is refused rather than
   drawn. */
function holdToGraph(prog) {
  const bad = [];
  if (!prog.nodes) bad.push('this file states no nodes');
  for (const g of prog.graphs || []) {
    if (!prog.nodes || !prog.nodes[g.entry]) bad.push('graph "' + g.id + '": the entry node is not in the node map');
    for (const p of g.presets || []) {
      let depth = 1;
      (p.trace.steps || []).forEach((m, i) => {
        if (m.k === 'propagate' || m.k === 'return') {
          if (depth < 1) bad.push('graph "' + g.id + '" run "' + p.name + '" move ' + i + ': ' + m.k + ' with no frame open');
          depth -= 1;
        } else if (m.k === 'call') {
          if (!prog.nodes[m.to]) bad.push('graph "' + g.id + '" run "' + p.name + '" move ' + i + ': calls "' + m.to + '", which is not a node');
          depth += 1;
        } else if (m.k === 'done' || m.k === 'uncaught') {
          depth = 0;
        }
      });
    }
  }
  return bad;
}

const refusals = holdToGraph(PROG);
if (refusals.length) {
  document.body.innerHTML =
    '<div class="refused"><h1>This file does not hold together, so nothing is drawn.</h1><ul>' +
    refusals.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') +
    '</ul></div>';
} else {
  start();
}

function start() {
  const layerNames = Object.keys(PROG.layers || {});
  const CUTS = G.cutEdges(PROG);
  /* tag -> its kinds, for the whole file. Named apart from the module's KINDS,
     which is the list of the three kinds themselves. The contract tab asks
     this about one node's declared tags; a tree row is handed the same
     derivation by treeRows. One function, so the two cannot disagree. */
  const TAG_KINDS = G.failureKinds(PROG);

  /* The file states a change and lists its graphs; a sheet draws one of them.
     Everything below reads the current graph through this one view rather than
     off the file root, so which graph is on the sheet is one line to change
     and not fifteen. The layers, the ambient values and the node map are the
     change's, so they are read from PROG itself.

     One state per graph, made when the reader first opens that sheet and kept
     from then on. That is the whole of what "a sheet keeps its own run,
     cursor, layer, view and open node" is: a switch swaps which state the page
     is reading, and never rebuilds one that exists. Made lazily because a
     ten-graph file would otherwise fold every trace of every graph before
     drawing the first. */
  const SHEETS = PROG.graphs.map(function () { return null; });
  let sheetAt = 0;
  let S = null, SHEET = null, LAYOUT = null;
  function useSheet(i) {
    const fresh = !SHEETS[i];
    if (fresh) SHEETS[i] = G.sheetState(PROG, i);
    sheetAt = i;
    S = SHEETS[i];
    SHEET = S.view;
    LAYOUT = S.layout;
    return fresh;
  }
  useSheet(0);

  /* -- what a node shows, under the layer in force ------------------------ */
  const rOf = id => {
    const layer = S.layer ? PROG.layers[S.layer] : null;
    const ov = layer && layer.nodes && layer.nodes[id];
    return ov && ov.requirements ? ov.requirements : (PROG.nodes[id].channels || {}).requirements || [];
  };
  const cutsFrom = (from, at) => CUTS.filter(c => c.layer === S.layer && c.from === from && c.at === at);
  const layerEntry = () => {
    const layer = S.layer ? PROG.layers[S.layer] : null;
    return (layer && layer.entry) || SHEET.entry;
  };
  /* Everything the call edges cannot reach from the layer's own entry draws as
     unreached. The geometry is untouched; only the ink changes. */
  const reachable = () => {
    const seen = new Set();
    (function go(id) {
      if (seen.has(id)) return;
      seen.add(id);
      (PROG.nodes[id].steps || []).forEach((s, i) => {
        if (s.op !== 'call' || !PROG.nodes[s.target]) return;
        if (cutsFrom(id, i).length) return;
        go(s.target);
      });
    })(layerEntry());
    return seen;
  };

  /* -- the drawing -------------------------------------------------------- */
  function drawWires(st, reach) {
    const taken = new Set(st.edges);
    const parts = [];
    parts.push(
      '<defs>' +
        '<marker id="ar-cold" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">' +
        '<path class="ar" d="M0,0 L8,4 L0,8 z"></path></marker>' +
        '<marker id="ar-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">' +
        '<path class="ar ar--ink" d="M0,0 L8,4 L0,8 z"></path></marker>' +
        '</defs><g>',
    );
    for (const e of LAYOUT.edges) {
      const key = e.from + '>' + e.to;
      const live = G.wireLive(st, e);
      const walked = taken.has(key);
      const cut = CUTS.some(c => c.layer === S.layer && c.from === e.from && c.to === e.to);
      const cold = cut || !reach.has(e.to);
      const inked = !cold && (live || walked);
      let cls = 'wire' + (cold ? '' : live ? ' wire--live' : walked ? ' wire--walked' : '') + (cut ? ' wire--cut' : '');
      const flow = G.wireFlow(S.redraw, e);
      if (flow) cls += ' wire--' + flow;
      parts.push('<path class="' + cls + '" d="' + e.call + '" marker-end="url(#' + (inked ? 'ar-ink' : 'ar-cold') + ')"></path>');
      if (e.hasE) parts.push('<path class="wire wire--err" d="' + e.err + '" marker-end="url(#ar-cold)"></path>');
      /* How deep a self call is, beside its loop. Static: it changes when the
         cursor moves and never on its own. */
      const count = e.self ? G.countMark(LAYOUT, st, e.from) : null;
      if (count && count.at) {
        parts.push('<text class="wire-count" x="' + count.at.x + '" y="' + count.at.y + '" text-anchor="middle">' + count.text + '</text>');
      }
    }
    parts.push('</g>');
    return (
      '<svg id="wires" viewBox="0 0 ' + LAYOUT.canvasW + ' ' + LAYOUT.canvasH +
      '" style="width:' + LAYOUT.canvasW + 'px;height:' + LAYOUT.canvasH + 'px" xmlns="http://www.w3.org/2000/svg">' +
      parts.join('') + '</svg>'
    );
  }

  const channelKey = k => '<b data-help="' + HELP[k] + '">' + k + '</b>';

  /* One E tag, with the kind the file gives it. The tag is author text and is
     escaped; the kind is one of three words the file never writes, so it is a
     mark. A tag the file gives no kind for prints bare — the page invents
     nothing — and one given two prints both, worst last. */
  const eTag = function (kinds, tag) {
    /* Indexed only when the table is there. A tag is a stranger's string, and
       an empty object literal standing in for a missing table would answer
       "constructor" with a function. */
    const k = kinds && kinds[tag];
    return esc(tag) + (k ? ' <span class="ekind">' + k.join(' ') + '</span>' : '');
  };

  function nodeBox(id, st, reach) {
    const n = PROG.nodes[id];
    const ch = n.channels || {};
    const p = LAYOUT.pos[id];
    const onStack = st.frames.some(f => f.nodeId === id);
    const visited = st.visited.indexOf(id) >= 0;
    const erroring = st.errorPath.some(e => e.nodeId === id && e.how === 'thrown');
    const cold = !reach.has(id) || !visited;
    const cls =
      'nd' + (cold ? ' nd--cold' : '') + (onStack ? ' nd--active' : '') +
      (erroring ? ' nd--error' : '') + (S.open === id ? ' nd--sel' : '');
    /* The module's word, summed over every site that entered this node: a box
       is a node and not a path. `threw` asks for the path role, as an effect
       that threw does — one condition, one role, and never caution directly,
       which the site theme folds to ink. */
    const state = G.nodeState(st, id);
    const chip = state === 'running'
      ? '<span class="av-label chip-help" style="margin-left:auto" data-help="The frame the cursor is in">running</span>'
      : state === 'waiting'
        ? '<span class="av-label chip-help" style="margin-left:auto" data-help="On the stack, suspended at a call, waiting for the callee to return">waiting</span>'
        : state === 'returned'
          ? '<span style="margin-left:auto"><span class="av-state av-state--normal chip-help" data-help="Entered and returned earlier in this run">returned</span></span>'
          : state === 'threw'
            ? '<span style="margin-left:auto"><span class="av-state caut chip-help" data-help="Entered earlier in this run, and a frame of it left by throwing. Whether a caller caught the error is the error path\'s to say">threw</span></span>'
            : '';
    const E = (ch.error || []).length ? (ch.error || []).map(esc).join(' &middot; ') : '<span class="none">never</span>';
    const R = rOf(id).length ? esc(rOf(id).join(', ')) : '<span class="none">none</span>';
    // Keyed by node, not by call site. The drawing shows one box per node, so
    // a mark read off the open frame would disappear the moment that frame
    // returned — while the tree, which is one row per call site, kept it.
    const fx = G.effectsOf(n)
      .map(function (e) {
        const mark = st.nodeEffects[id + '[' + e.at + ']'];
        const k = mark === 'threw' ? ' fx--fail' : mark === 'returned' ? ' fx--ok' : '';
        return (
          '<div class="fx' + k + '"><span class="fx-dot"></span><span class="fx-lead"></span>' +
          '<span class="fx-txt">' + esc(e.kind) + ' <span class="dim">' + esc(e.desc) + '</span></span></div>'
        );
      })
      .join('');
    const cutNote = CUTS.filter(c => c.layer === S.layer && c.to === id).length
      ? '<div class="nd-cut">cut under ' + esc(S.layer) + '</div>'
      : '';
    /* The recursion count sits beside the loop wire. Only when it is too wide
       for the loop's corner does it come into the box, here. */
    const count = G.countMark(LAYOUT, st, id);
    const countChip = count && !count.at
      ? '<span class="nd-count chip-help" data-help="Frames of this node open now">' + count.text + '</span>'
      : '';
    return (
      '<div class="' + cls + '" data-node="' + id + '" style="left:' + p.x + 'px;top:' + p.y +
      'px;width:' + LAYOUT.width + 'px">' +
      '<div class="nd-top"><span class="av-label chip-help" data-help="' + HELP.role + '">' + esc(n.role) + '</span>' + countChip + chip + '</div>' +
      '<div class="nd-name">' + esc(n.name) + '</div>' +
      '<div class="nd-loc">' + esc(n.loc) + '</div>' +
      '<div class="nd-ch">' + channelKey('success') + '<span>' + esc(ch.success || '—') + '</span>' +
      channelKey('error') + '<span>' + E + '</span>' + channelKey('requirements') + '<span>' + R + '</span></div>' +
      fx + cutNote + '</div>'
    );
  }

  /* -- the tree ----------------------------------------------------------- */
  /* HOW THE SHEET DRAWS ONE OF THE FOLD'S WORDS. Presentation only: which
     position a word IS stays with G.ERROR_POSITION in the module, so the tree,
     the rail and the text still cannot disagree about that. The glyphs are
     drafting marks and not pictures — a filled lozenge where the error was
     thrown, a vertical where it propagated, a corner where it stopped, an
     arrow where it left the top. The tree and the rail read this same table,
     so one word looks the same in both. Only the last has no row class: an
     error reaching the top names no node, so no row carries it and the rail
     states it alone. */
  const PATH_MARK = {
    'thrown': { cls: 'tr--thrown', glyph: '◆' },
    'propagated': { cls: 'tr--onpath', glyph: '│' },
    'caught': { cls: 'tr--caught', glyph: '└' },
    'reached the top uncaught': { cls: null, glyph: '↑' },
  };

  function drawTree() {
    const rows = G.treeRows(SHEET, SHEET.presets[S.run].trace, S.layer, S.at, S.states);
    return rows
      .map(function (row) {
        /* Two independent signals on one row, because a frame that catches is
           open and on the path at once. Run state takes the row's own
           left border, the error path an inset stripe just within it. */
        const p = row.path ? PATH_MARK[row.path] : null;
        const position = row.path ? G.ERROR_POSITION[row.path] : null;
        const caught = position === 'caught';
        const cls =
          'tr' + (row.state === 'not called' ? ' tr--cold' : '') +
          (row.state === 'running' ? ' tr--active' : row.state === 'waiting' ? ' tr--waiting' : '') +
          (p && p.cls ? ' ' + p.cls : '') + (row.id === S.open ? ' tr--sel' : '');
        const E = row.error.length ? row.error.map(eTag.bind(null, row.kinds)).join(' &middot; ') : '<span class="none">never</span>';
        const rr = row.rename && row.rename.length ? row.rename : row.requirements;
        const R = rr.length ? esc(rr.join(', ')) : '<span class="none">none</span>';
        const marks = row.effects
          .map(function (f) {
            /* The outcome takes the weight of the path label. Same two roles,
               not a third and fourth name: an effect that threw and an error
               in flight are one condition, and one that returned is resolved.
               Not called is an absence, so it takes no chip at all — it stays
               plain text at the ink floor, and every chip drawn means
               something. */
            const k = f.mark === 'threw' ? 'caut' : f.mark === 'returned' ? 'ok' : 'none';
            const chip = f.mark === 'not called' ? '' : ' gt-chip';
            return '<span class="tr-fx">&middot; ' + esc(f.kind) +
              ' <span class="' + k + chip + ' tr-fxm--' + f.mark.replace(/ /g, '-') + '">' + esc(f.mark) + '</span></span>';
          })
          .join('');
        const siteText = row.site && (row.site.label || row.site.aside)
          ? '<span class="tr-site">' + esc(row.site.aside || row.site.label) + '</span>'
          : '';
        /* Where this call site stands on the error at the cursor, read off the
           row: the module matched it by site, so a node called from two places
           is marked only where the error went. The glyph goes before the name
           and the word after it, so the stripe, the glyph and the word sit
           together and read as one mark. Both are the fold's own words, never
           the file's; the tag is the file's, so it is escaped and kept outside
           the chip, which sets caps. */
        const glyph = p
          ? '<span class="tr-gl' + (caught ? ' tr-gl--caught' : '') + ' chip-help" data-help="' + HELP.err[position] + '">' + p.glyph + '</span>'
          : '';
        const plabel = p
          ? '<span class="tr-pl' + (caught ? ' tr-pl--caught' : '') + ' gt-chip">' + row.path + '</span>' +
            (position === 'thrown' ? '<span class="tr-err-tag">' + esc(row.errorPath.tag) + '</span>' : '')
          : '';
        return (
          '<div class="' + cls + '" data-node="' + row.id + '" style="padding-left:' + (row.depth * 24 + 12) + 'px">' +
          '<span class="tr-name">' + (row.depth ? '&rarr; ' : '') + glyph + esc(row.name) +
          (row.repeat ? ' <span class="none">(seen above — stopped)</span>' : '') + plabel + '</span>' +
          '<span class="av-label tr-kind" data-help="' + HELP.role + '">' + esc(row.role) + '</span>' +
          '<span class="tr-ch">' + channelKey('success') + ' ' + esc(row.success || '—') + '<span class="sep"></span>' + channelKey('error') + ' ' + E +
          '<span class="sep"></span>' + channelKey('requirements') + ' ' + R + '</span>' +
          '<span class="tr-under">' + siteText + marks + '</span></div>'
        );
      })
      .join('');
  }

  /* -- the rail ----------------------------------------------------------- */
  function drawStack(st) {
    if (!st.frames.length) return '<div class="av-annot">no frame open</div>';
    return st.frames
      .slice()
      .reverse()
      .map(function (f, i) {
        const n = PROG.nodes[f.nodeId];
        return (
          '<button class="frame' + (i === 0 ? ' frame--top' : '') + '" data-node="' + f.nodeId + '">' +
          esc(n.name) + ' <span class="dim">[' + f.pc + ']</span></button>'
        );
      })
      .join('');
  }

  const show = v => (typeof v === 'string' ? v : JSON.stringify(v));

  function drawInputs() {
    const input = SHEET.presets[S.run].input || {};
    const keys = Object.keys(input);
    if (!keys.length) return '<div class="av-annot">this run starts from nothing</div>';
    return keys
      .map(function (k) {
        return '<div class="var"><span class="var-k">' + esc(k) + '</span><span class="var-v">' + esc(show(input[k])) + '</span></div>';
      })
      .join('');
  }

  function drawErrPath(st) {
    if (!st.errorPath.length) return '<div class="av-annot">nothing has thrown</div>';
    return st.errorPath
      .map(function (e) {
        const who = e.nodeId ? PROG.nodes[e.nodeId].name : 'the top';
        const tag = e.tag ? ' <b>' + esc(e.tag) + '</b>' : '';
        const msg = e.message ? ' <span class="dim">' + esc(e.message) + '</span>' : '';
        const ch = e.cause ? ' <span class="caut">' + esc(e.cause) + '</span>' : '';
        /* The same glyph the tree draws for the same word, so the rail's list
           and the marked rows beside it read as one path in two views. */
        const mark = PATH_MARK[e.how];
        const gl = '<span class="epath-gl' + (e.how === 'caught' ? ' epath-gl--caught' : '') + '">' +
          (mark ? mark.glyph : '') + '</span>';
        return '<div class="row">' + gl + '<span class="row-k">' + esc(who) + '</span><span class="row-v">' + esc(e.how) + tag + ch + msg + '</span></div>';
      })
      .join('');
  }

  function drawLedger(st) {
    if (!st.ledger.length) return '<div class="av-annot">nothing touched the outside world yet</div>';
    return st.ledger
      .map(function (l, i) {
        const mark = l.outcome === 'threw'
          ? '<span class="caut">threw ' + esc(l.raised.tag) + ' — ' + esc(l.raised.message) + '</span>'
          : '<span class="ok">' + (l.result === undefined ? 'went on' : esc(show(l.result))) + '</span>';
        return (
          '<div class="led"><span class="led-seq">' + (i + 1) + '</span><span class="led-body">' +
          '<div>' + esc(l.kind) + ' <span class="dim">' + esc(l.desc) + '</span></div>' +
          '<div>' + mark + '</div></span></div>'
        );
      })
      .join('');
  }

  /* -- the cutaway -------------------------------------------------------- */

  /* Which lines the run has touched, up to the cursor. The frames of every
   * state so far are the record: a pc a frame sat on is a pc the run reached.
   * Read forward from zero rather than from the current state, because a
   * frame that has already returned is gone from st.frames and its lines are
   * still lines the run executed — which is the whole distinction between a
   * line that ran and a branch that never did. */
  function ranPcs(open, at) {
    const seen = new Set();
    for (let i = 0; i <= at && i < S.states.length; i++) {
      S.states[i].frames.forEach(function (f) { if (f.nodeId === open) seen.add(f.pc); });
    }
    return seen;
  }

  /* A call or an effect is marked by what the run did with it, never by what
   * it is. The fold already records both: an effect's outcome by node and pc,
   * a call site's entries and returns by key. A site the run has never called
   * carries no mark at all — an unmarked site is a fact, not a gap. */
  function siteClass(st, open, s, i) {
    if (s.op === 'effect') {
      const outcome = st.nodeEffects[open + '[' + i + ']'];
      return outcome === 'threw' ? ' av-code-site--failed'
        : outcome === 'returned' ? ' av-code-site--caught'
        : '';
    }
    /* SUMMED OVER EVERY PATH THAT REACHED THIS STEP. A listing is one node's
     * source and not one path through the graph, so this asks by node and
     * step. The fold's own table is keyed by the path from the entry — a step
     * the tree draws under two different callers is two entries there and one
     * line here, and `callCounts` is what puts them back together. */
    const site = Groundtrack.callCounts(st, open, i);
    if (!site.entered) return '';
    /* Still on the stack: the call has an outcome later, not now. */
    if (site.open) return '';
    /* EVERY entry came back, not merely one of them. A site is one line of
     * source, and a run can run that line more than once — a loop, a repeat.
     * `returned > 0` would call a site that went in twice and came back once
     * a clean return, which is the reading a reader is most likely to act on
     * and the one most likely to be wrong. */
    if (site.returned === site.entered) return ' av-code-site--caught';
    /* Entered more times than it returned, and nothing from it is on the
     * stack: at least one of those entries left by throwing. Read from the
     * site's own counts and not from st.errorPath, which holds where an error
     * is NOW — a failure a handler caught and the run then ran past leaves
     * errorPath empty while the call it came from still threw. */
    return ' av-code-site--path';
  }

  function drawSource(st) {
    const n = PROG.nodes[S.open];
    const here = st.frames.filter(f => f.nodeId === S.open).map(f => f.pc);
    const topFrame = st.frames.length ? st.frames[st.frames.length - 1] : null;
    const cursor = topFrame && topFrame.nodeId === S.open ? topFrame.pc : -1;
    const ran = ranPcs(S.open, S.at);
    return '<div class="av-code">' + (n.steps || [])
      .map(function (s, i) {
        const site = 'av-code-site' + siteClass(st, S.open, s, i);
        const body =
          s.op === 'comment' ? '<span class="av-code-note">' + esc(s.comment) + '</span>'
          : s.op === 'var' ? '<span class="av-code-kw">var</span> <span class="av-code-name">' + esc(s.name) + '</span> <span class="av-code-note">=</span> <span class="av-code-lit">' + esc(s.expr) + '</span>'
          : s.op === 'if' ? '<span class="av-code-kw">if</span> <span class="av-code-lit">' + esc(s.cond) + '</span> <span class="av-code-note">&rarr;</span> <span class="av-code-name">' + esc(s.then) + '</span> <span class="av-code-kw">else</span> <span class="av-code-name">' + esc(s.else) + '</span>'
          : s.op === 'goto' ? '<span class="av-code-kw">goto</span> <span class="av-code-name">' + esc(s.to) + '</span>'
          : s.op === 'call' ? '<span class="av-code-kw">call</span> <span class="' + site + '">' + esc(s.target) + '</span>'
          : s.op === 'effect' ? '<span class="av-code-kw">effect</span> <span class="' + site + '">' + esc(s.kind) + '</span> <span class="av-code-note">' + esc(s.desc) + '</span>'
          : s.op === 'throw' ? '<span class="av-code-kw">throw</span> <span class="av-code-name">' + esc(s.tag) + '</span> <span class="av-code-lit">' + esc(s.cause) + '</span> <span class="av-code-note">' + esc(s.message) + '</span>'
          : '<span class="av-code-kw">return</span> <span class="av-code-lit">' + esc(s.expr) + '</span>';
        const aside = s.aside ? '<div class="av-code-note">' + esc(s.aside) + '</div>' : '';
        const handlers = (s.onError || [])
          .map(function (h) { return '<div class="av-code-note">on ' + esc(h.tag) + ' &rarr; ' + esc(h.goto) + '</div>'; })
          .join('');
        /* One line takes one state, most specific first. The cursor is on the
         * stack and the stack has run, so the order is what separates them. */
        const state =
          i === cursor ? ' av-code-line--cursor'
          : here.indexOf(i) >= 0 ? ' av-code-line--live'
          : ran.has(i) ? ' av-code-line--ran'
          : ' av-code-line--skip';
        return (
          '<div class="av-code-line' + state + '">' +
          '<span class="av-code-num">' + i + '</span>' +
          '<span class="av-code-label">' + (s.label ? esc(s.label) : '') + '</span>' +
          '<span>' + body + aside + handlers + '</span></div>'
        );
      })
      .join('') + '</div>';
  }

  /* One tree answers all three questions: what this node changes, what other
     nodes on this sheet change, and what the change touches that no node
     accounts for. The markup is built in the shared module — see the note on
     filesMarkup for why it is there and not here. */
  function drawFiles() {
    return G.filesMarkup(SHEET, S.open);
  }

  /* One E tag on the contract tab: the tag, its kind, and the one thing this
     node does with it. A node throws the tag, catches it, both, or neither —
     and neither means it passes up from beneath, which is the fact a reader
     needs to know where a failure goes when it leaves this node. */
  function eContract(node, tag) {
    const f = G.tagFate(node, tag);
    const fate = f.throws && f.catches ? 'throws &middot; catches'
      : f.throws ? 'throws'
        : f.catches ? 'catches'
          : 'passes up from beneath';
    return '<div class="etag">' + eTag(TAG_KINDS, tag) + ' <span class="efate">' + fate + '</span></div>';
  }

  function drawContract() {
    const n = PROG.nodes[S.open];
    const ch = n.channels || {};
    const line = (k, v, help) =>
      '<div class="row"><span class="row-k"' + (help ? ' data-help="' + help + '"' : '') + ' style="width:8rem">' + k + '</span><span class="row-v">' + v + '</span></div>';
    const cx = G.complexityOf(n);
    const parts = [];
    if (cx.ifs) parts.push(cx.ifs + ' if');
    if (cx.handlers) parts.push(cx.handlers + ' handler' + (cx.handlers === 1 ? '' : 's'));
    if (cx.loops) parts.push(cx.loops + ' loop' + (cx.loops === 1 ? '' : 's'));
    const cxText = String(cx.value) + (parts.length ? ' <span class="dim">— 1 + ' + parts.join(' + ') + '</span>' : ' <span class="dim">— one path through</span>');
    return (
      line('role', esc(n.role), HELP.role) +
      line('takes', (n.params || []).length ? esc((n.params || []).join(', ')) : '<span class="none">nothing</span>') +
      line('success', esc(ch.success || '—'), HELP.success) +
      line('error', (ch.error || []).length ? (ch.error || []).map(eContract.bind(null, n)).join('') : '<span class="none">never</span>', HELP.error) +
      line('requirements', rOf(S.open).length ? esc(rOf(S.open).join(', ')) : '<span class="none">nothing</span>', HELP.requirements) +
      line('entered by', (n.enteredBy || []).length ? esc((n.enteredBy || []).join(', ')) : '<span class="none">no spec calls this node</span>',
        'The test files whose specs call this node directly. A node covered through its caller lists none.') +
      line('paths', cxText, HELP.paths)
    );
  }

  /* -- the footer band ---------------------------------------------------- */
  function drawTitleBlock() {
    const run = SHEET.presets[S.run];
    const authored = run.trace.provenance === 'authored';
    const cell = (k, v) => '<div class="av-titleblock-cell"><span class="av-titleblock-key">' + k + '</span><span class="av-titleblock-val">' + v + '</span></div>';
    /* Authored draws as a bordered caution stamp, captured as a nominal one —
       one of green's few honest uses. */
    const stamp =
      '<span class="av-state stamp ' + (authored ? 'av-state--caution' : 'av-state--normal') + '" data-help="' +
      (authored ? HELP.authored : HELP.captured) + '">' + (authored ? 'authored' : 'captured') + '</span>';
    return (
      cell('file', esc(PROG.id)) +
      /* What this sheet draws, so a reader can count the boxes and agree with
         it. The change's node map is larger the moment a second graph exists,
         and a number on the sheet that nothing on the sheet matches is worse
         than no number. */
      cell('nodes', String(LAYOUT.order.length)) +
      cell('runs', String(SHEET.presets.length)) +
      cell('changed files', PROG.files ? String(PROG.files.length) : '<span class="none">not stated</span>') +
      cell('trace', stamp)
    );
  }

  /* The band under the drawing, where the cut is audited. Built in the shared
     module — see the note on sheetFactsMarkup for why it is there and not
     here. */
  function drawSheetFacts() {
    return G.sheetFactsMarkup(SHEET);
  }

  /* -- render ------------------------------------------------------------- */
  const applyTransform = () => {
    $('canvas').style.transform = 'translate(' + S.panX + 'px,' + S.panY + 'px) scale(' + S.zoom + ')';
  };

  function render() {
